<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Feliz Cumpleaños, Preciosa 🌼</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-yellow: #FFFBE6;
            --pastel-yellow: #FDF181;
            --pastel-pink: #FDECF2;
            --deep-pink: #F4A7B9;
            --text-pink: #F28C9F;
            --hover-pink: #F08CA2;
            --pastel-lilac: #E6E6FA;
            --deep-lilac: #D9C4EC;
            --text-dark: #7A5B62;
            --white: #FFFFFF;
            --font-ui: 'Baloo 2', sans-serif;
            --font-hand: 'Caveat', cursive;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-yellow);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(253, 241, 129, 0.4) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(244, 167, 185, 0.3) 0%, transparent 40%);
            font-family: var(--font-ui);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            color: var(--text-dark);
            padding: 1rem;
        }

        .bg-flowers {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .floating-flower {
            position: absolute;
            opacity: 0.6;
            animation: float-flower 8s infinite ease-in-out;
        }

        @keyframes float-flower {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-30px) rotate(15deg); }
        }

        .app-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 600px;
            background-color: var(--white);
            border: 5px solid var(--deep-pink);
            border-radius: 40px;
            box-shadow: 0 15px 35px rgba(244, 167, 185, 0.3), inset 0 0 20px rgba(253, 236, 242, 0.8);
            padding: 2.5rem 2rem;
            text-align: center;
            min-height: 550px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .screen {
            display: none;
            opacity: 0;
            transition: opacity 0.6s ease;
            width: 100%;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .screen.active {
            display: flex;
            opacity: 1;
            animation: pop-in 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes pop-in {
            0% { transform: scale(0.9) translateY(20px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }

        h1, h2 {
            font-family: var(--font-hand);
            color: var(--text-pink);
            font-size: clamp(2.8rem, 8vw, 3.8rem);
            line-height: 1.1;
            margin-bottom: 0.5rem;
            text-shadow: 2px 2px 0px rgba(244, 167, 185, 0.2);
        }

        .subtitle {
            font-size: clamp(1.1rem, 4vw, 1.3rem);
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 1.5rem;
            opacity: 0.8;
        }

        .pony-wrapper {
            width: 220px;
            height: 220px;
            margin: 0 auto 1rem;
            animation: levitate 4s infinite ease-in-out;
            position: relative;
        }

        @keyframes levitate {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .wing {
            transform-origin: 30% 60%;
            animation: flap 0.3s infinite alternate ease-in-out;
        }

        @keyframes flap {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(-35deg); }
        }

        .btn-group {
            display: flex;
            gap: 1rem;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            margin-top: 1rem;
            position: relative;
            min-height: 60px;
            width: 100%;
        }

        button {
            font-family: var(--font-ui);
            font-weight: 700;
            font-size: 1.2rem;
            padding: 0.8rem 2rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
            border: none;
        }

        .btn-yes {
            background-color: var(--text-pink);
            color: var(--white);
            box-shadow: 0 6px 0px #D8899D, 0 10px 15px rgba(242, 140, 159, 0.4);
            z-index: 2;
        }

        .btn-yes:hover {
            background-color: var(--hover-pink);
            transform: translateY(-2px);
        }

        .btn-yes:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0px #D8899D;
        }

        .btn-no {
            background-color: var(--white);
            color: var(--text-pink);
            border: 3px solid var(--deep-pink);
            box-shadow: 0 6px 0px var(--pastel-pink);
            z-index: 3;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .btn-no:hover {
            transform: translateY(-2px);
        }

        .no-msg-text {
            width: 100%;
            margin-top: 15px;
            font-size: 1.1rem;
            color: var(--deep-pink);
            font-weight: 700;
            min-height: 24px;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.2rem;
            margin-top: 1rem;
            width: 100%;
            max-width: 350px;
            margin-left: auto;
            margin-right: auto;
        }

        .surprise-card {
            background: linear-gradient(135deg, var(--white), var(--pastel-yellow));
            border: 3px solid var(--pastel-yellow);
            border-radius: 25px;
            aspect-ratio: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 8px 0px #E9D26B, 0 15px 20px rgba(233, 210, 107, 0.3);
            position: relative;
        }

        .surprise-card svg {
            width: 60%;
            height: 60%;
            transition: transform 0.3s ease;
        }

        .surprise-card:hover:not(.opened) {
            transform: translateY(-8px) scale(1.05);
        }

        .surprise-card:hover:not(.opened) svg {
            transform: rotate(10deg) scale(1.1);
        }

        .surprise-card:active:not(.opened) {
            transform: translateY(2px);
            box-shadow: 0 2px 0px #E9D26B;
        }

        .surprise-card.opened {
            background: var(--pastel-pink);
            border-color: var(--deep-pink);
            box-shadow: 0 4px 0px var(--deep-pink);
            cursor: default;
            opacity: 0.8;
            transform: scale(0.95);
        }
        
        .surprise-card.opened svg {
            filter: grayscale(0.5);
            opacity: 0.5;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background-color: rgba(255, 251, 230, 0.85);
            backdrop-filter: blur(8px);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            padding: 1rem;
        }

        .modal-overlay.show {
            opacity: 1;
            pointer-events: all;
        }

        .modal-content {
            background: var(--white);
            border: 4px dashed var(--deep-pink);
            border-radius: 35px;
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 450px;
            text-align: center;
            transform: scale(0.8) translateY(30px);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 20px 40px rgba(244, 167, 185, 0.25);
            position: relative;
        }

        .modal-overlay.show .modal-content {
            transform: scale(1) translateY(0);
        }

        .mini-pony {
            width: 120px;
            height: 120px;
            margin: -60px auto 10px; /* Pops out of top */
            animation: levitate 3s infinite ease-in-out;
            background: var(--white);
            border-radius: 50%;
            padding: 10px;
            border: 3px solid var(--deep-pink);
        }

        .modal-poem {
            font-family: var(--font-hand);
            font-size: 1.8rem;
            color: var(--text-dark);
            line-height: 1.3;
            margin-bottom: 1.5rem;
            white-space: pre-line;
        }

        .final-action {
            display: none;
            margin-top: 2rem;
            animation: pop-in 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border-top: 2px dashed var(--deep-lilac);
            padding-top: 1.5rem;
            width: 100%;
        }

        .final-action.show {
            display: block;
        }

        .final-text-viena {
            font-family: var(--font-hand);
            font-size: 2.2rem;
            color: var(--text-pink);
            line-height: 1.1;
            margin-bottom: 0.2rem;
        }

        .final-author {
            font-family: var(--font-hand);
            font-size: 1.8rem;
            color: var(--deep-pink);
            margin-bottom: 1.5rem;
        }

        .btn-pulse {
            background: linear-gradient(135deg, var(--text-pink), #FF6B8B);
            color: white;
            font-size: 1.2rem;
            padding: 1rem 1.5rem;
            animation: pulse 2s infinite;
            box-shadow: 0 6px 0px #D8899D;
            width: 100%;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 6px 0px #D8899D, 0 0 0 0 rgba(242, 140, 159, 0.7); }
            50% { transform: scale(1.05); box-shadow: 0 6px 0px #D8899D, 0 0 0 15px rgba(242, 140, 159, 0); }
            100% { transform: scale(1); box-shadow: 0 6px 0px #D8899D, 0 0 0 0 rgba(242, 140, 159, 0); }
        }

        .form-title {
            font-size: 1.4rem;
            color: var(--text-dark);
            margin-bottom: 1rem;
            font-weight: 700;
        }

        textarea {
            width: 100%;
            height: 120px;
            border: 3px solid var(--pastel-pink);
            border-radius: 20px;
            padding: 1rem;
            font-family: var(--font-ui);
            font-size: 1.1rem;
            color: var(--text-dark);
            resize: none;
            outline: none;
            transition: border-color 0.3s;
            margin-bottom: 1rem;
            background-color: #FAFAFA;
        }

        textarea:focus {
            border-color: var(--text-pink);
            background-color: var(--white);
        }

        .success-message {
            display: none;
            font-family: var(--font-hand);
            font-size: 2.2rem;
            color: var(--text-pink);
            animation: pop-in 0.5s ease;
        }

        @media (max-width: 480px) {
            .app-container { padding: 2rem 1.5rem; min-height: 480px; }
            .pony-wrapper { width: 180px; height: 180px; }
            .btn-group { flex-direction: column; align-items: center; }
            button { width: 100%; max-width: 280px; }
            .cards-grid { gap: 1rem; }
            .modal-content { padding: 2rem 1.5rem; }
            .mini-pony { width: 100px; height: 100px; margin-top: -50px; }
            .final-text-viena { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

    <div class="bg-flowers" id="bg-layer">
        <!-- Flowers injected by JS -->
    </div>

    <main class="app-container">
        
        <!-- Screen 1: Intro -->
        <section class="screen active" id="screen-1">
            <div class="pony-wrapper">
                <!-- Advanced Custom Fluttershy SVG with Wing Animation -->
                <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#FFF59D" />
                            <stop offset="100%" stop-color="#FBC02D" />
                        </linearGradient>
                        <linearGradient id="maneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#F8BBD0" />
                            <stop offset="100%" stop-color="#F06292" />
                        </linearGradient>
                    </defs>
                    
                    <!-- Back Wing (Static for depth) -->
                    <path d="M110 80 Q140 60 135 90 Q150 75 145 95 Q160 85 150 105 Q130 110 110 90" fill="#FFF59D" opacity="0.7"/>

                    <!-- Tail -->
                    <path d="M140 120 C180 110 190 160 170 180 C150 160 140 160 130 140 Z" fill="url(#maneGrad)"/>
                    <path d="M145 125 C185 120 195 170 175 190 C160 170 150 165 140 150 Z" fill="#F48FB1" opacity="0.6"/>

                    <!-- Back Legs -->
                    <path d="M115 130 L110 175 C110 180 125 180 125 175 L130 135" fill="#FFF176"/>
                    <path d="M85 135 L80 175 C80 180 95 180 95 175 L100 140" fill="#FFF176"/>

                    <!-- Body -->
                    <path d="M70 90 C90 70 130 90 145 120 C150 130 140 150 120 150 L85 150 C60 150 50 130 50 110 Z" fill="url(#bodyGrad)"/>
                    
                    <!-- Front Legs -->
                    <path d="M125 135 L125 180 C125 185 140 185 140 180 L140 135" fill="url(#bodyGrad)"/>
                    <path d="M95 140 L95 180 C95 185 110 185 110 180 L110 140" fill="url(#bodyGrad)"/>

                    <!-- Neck & Head -->
                    <path d="M55 110 C55 80 70 50 95 55 C110 60 115 80 100 100 Z" fill="url(#bodyGrad)"/>
                    <ellipse cx="75" cy="65" rx="30" ry="26" fill="url(#bodyGrad)"/>
                    
                    <!-- Snout -->
                    <ellipse cx="50" cy="75" rx="18" ry="14" fill="url(#bodyGrad)"/>
                    <!-- Smile -->
                    <path d="M40 82 Q48 88 58 82" stroke="#E65100" stroke-width="2" fill="none" stroke-linecap="round"/>
                    
                    <!-- Eye (Fluttershy signature sweet eye) -->
                    <path d="M60 60 C 65 50, 80 50, 85 62" stroke="#4E342E" stroke-width="3" fill="none" stroke-linecap="round"/>
                    <path d="M85 62 L90 60 M82 66 L86 68 M78 68 L80 72" stroke="#4E342E" stroke-width="2" fill="none" stroke-linecap="round"/>

                    <!-- Ear -->
                    <path d="M85 40 Q95 20 105 40 Z" fill="url(#bodyGrad)"/>

                    <!-- Mane -->
                    <path d="M70 45 C70 20 95 10 110 35 C130 60 115 95 105 115 C90 135 65 125 85 90 C95 65 95 45 85 40 Z" fill="url(#maneGrad)"/>
                    
                    <!-- ANIMATED Front Wing -->
                    <g class="wing">
                        <path d="M100 105 Q125 70 135 100 Q150 85 155 110 Q170 95 160 120 Q145 135 115 120 Z" fill="#FFF9C4" stroke="#FBC02D" stroke-width="2" stroke-linejoin="round"/>
                        <!-- Wing details -->
                        <path d="M115 110 Q125 90 135 100 M120 115 Q135 95 145 110" stroke="#FBC02D" stroke-width="1.5" fill="none" stroke-linecap="round"/>
                    </g>
                </svg>
            </div>
            <h1>Feliz Cumpleaños,<br>Preciosa</h1>
            <p class="subtitle">¿Quieres ver tu sorpresa?</p>
            
            <div class="btn-group">
                <button class="btn-no" id="btn-no">No gracias</button>
                <button class="btn-yes" id="btn-yes">Sí porfavor 🌸</button>
            </div>
            <!-- Div to show progressive text for "No" clicks -->
            <div class="no-msg-text" id="no-msg-text"></div>
        </section>

        <!-- Screen 2: Cards & Final Action -->
        <section class="screen" id="screen-2">
            <h2>¡Sorpresaaa mi amoor!</h2>
            <p class="subtitle">Haz click en cada cartita mágica ✨</p>

            <div class="cards-grid" id="cards-container">
                <!-- Cards injected by JS -->
            </div>

            <!-- Final action (appears after 4 cards) -->
            <div class="final-action" id="final-action">
                <p class="final-text-viena">Feliz flores amarillas Viena Rub** 🌼</p>
                <p class="final-author">Daniel</p>
                <button class="btn-yes btn-pulse" id="btn-final">¿Quieres unas flores físicas? Toca aquí 💌</button>
            </div>
        </section>

    </main>

    
    <!-- Poem Modal -->
    <div class="modal-overlay" id="modal-poem">
        <div class="modal-content">
            <div class="mini-pony">
                <!-- Re-using the animated SVG for the modal -->
                <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" style="width:100%; height:100%;">
                    <use href="#pony-def" />
                </svg>
            </div>
            <p class="modal-poem" id="modal-text"></p>
            <button class="btn-yes" id="btn-close-poem">Cerrar ✨</button>
        </div>
    </div>

    <!-- Form Modal -->
    <div class="modal-overlay" id="modal-form">
        <div class="modal-content">
            <!-- Normal State -->
            <div id="form-container">
                <h3 class="form-title">Escribe qué mensaje quieres enviarme además de pedirme tus flores físicas :D</h3>
                <form id="flower-form">
                    <!-- Setup FormSubmit -->
                    <!-- This input prevents spam, standard practice for FormSubmit -->
                    <input type="hidden" name="_captcha" value="false">
                    <input type="hidden" name="_subject" value="🌸 ¡Petición de Flores Físicas y Mensaje de Cumpleaños! 🌸">
                    
                    <textarea name="mensaje" id="mensaje" placeholder="Escribe tu mensajito mágico aquí..." required></textarea>
                    
                    <button type="submit" class="btn-yes" id="btn-submit" style="width: 100%;">Enviar Mensaje 💌</button>
                </form>
            </div>
            
            <!-- Success State -->
            <div class="success-message" id="success-container">
                ¡Mensaje enviado!<br>Yo te respondo cuando me de cuenta 💖
                <br><br>
                <button class="btn-yes" id="btn-close-success" style="font-size: 1rem;">Cerrar 🌼</button>
            </div>
        </div>
    </div>

    <!-- Hidden definition of the Pony to reuse in the modal cleanly -->
    <svg style="display: none;">
        <defs>
            <g id="pony-def">
                <!-- Winged pony definition identical to main screen -->
                 <path d="M110 80 Q140 60 135 90 Q150 75 145 95 Q160 85 150 105 Q130 110 110 90" fill="#FFF59D" opacity="0.7"/>
                 <path d="M140 120 C180 110 190 160 170 180 C150 160 140 160 130 140 Z" fill="#F8BBD0"/>
                 <path d="M115 130 L110 175 C110 180 125 180 125 175 L130 135" fill="#FFF176"/>
                 <path d="M85 135 L80 175 C80 180 95 180 95 175 L100 140" fill="#FFF176"/>
                 <path d="M70 90 C90 70 130 90 145 120 C150 130 140 150 120 150 L85 150 C60 150 50 130 50 110 Z" fill="#FFF59D"/>
                 <path d="M125 135 L125 180 C125 185 140 185 140 180 L140 135" fill="#FFF59D"/>
                 <path d="M95 140 L95 180 C95 185 110 185 110 180 L110 140" fill="#FFF59D"/>
                 <path d="M55 110 C55 80 70 50 95 55 C110 60 115 80 100 100 Z" fill="#FFF59D"/>
                 <ellipse cx="75" cy="65" rx="30" ry="26" fill="#FFF59D"/>
                 <ellipse cx="50" cy="75" rx="18" ry="14" fill="#FFF59D"/>
                 <path d="M40 82 Q48 88 58 82" stroke="#E65100" stroke-width="2" fill="none" stroke-linecap="round"/>
                 <path d="M60 60 C 65 50, 80 50, 85 62" stroke="#4E342E" stroke-width="3" fill="none" stroke-linecap="round"/>
                 <path d="M85 62 L90 60 M82 66 L86 68 M78 68 L80 72" stroke="#4E342E" stroke-width="2" fill="none" stroke-linecap="round"/>
                 <path d="M85 40 Q95 20 105 40 Z" fill="#FFF59D"/>
                 <path d="M70 45 C70 20 95 10 110 35 C130 60 115 95 105 115 C90 135 65 125 85 90 C95 65 95 45 85 40 Z" fill="#F8BBD0"/>
                 <g class="wing">
                     <path d="M100 105 Q125 70 135 100 Q150 85 155 110 Q170 95 160 120 Q145 135 115 120 Z" fill="#FFF9C4" stroke="#FBC02D" stroke-width="2" stroke-linejoin="round"/>
                 </g>
            </g>
        </defs>
    </svg>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            // 1. Generate Floating Background Flowers
            const bgLayer = document.getElementById('bg-layer');
            const flowerSVG = `
                <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <g fill="#FDF181" stroke="#FBC02D" stroke-width="2">
                        <circle cx="50" cy="20" r="15"/>
                        <circle cx="50" cy="80" r="15"/>
                        <circle cx="20" cy="50" r="15"/>
                        <circle cx="80" cy="50" r="15"/>
                    </g>
                    <circle cx="50" cy="50" r="12" fill="#F4A7B9"/>
                </svg>
            `;

            for (let i = 0; i < 12; i++) {
                const f = document.createElement('div');
                f.className = 'floating-flower';
                f.innerHTML = flowerSVG;
                f.style.width = `${30 + Math.random() * 30}px`;
                f.style.height = f.style.width;
                f.style.left = `${Math.random() * 100}vw`;
                f.style.top = `${Math.random() * 100}vh`;
                f.style.animationDelay = `${Math.random() * 5}s`;
                f.style.animationDuration = `${7 + Math.random() * 5}s`;
                bgLayer.appendChild(f);
            }

            // 2. Screen 1 Logic (Progressive "No" button)
            const btnNo = document.getElementById('btn-no');
            const btnYes = document.getElementById('btn-yes');
            const screen1 = document.getElementById('screen-1');
            const screen2 = document.getElementById('screen-2');
            const noMsgText = document.getElementById('no-msg-text');
            
            const noTaps = [
                "¿Seguuura? 🥺",
                "Piénsalo bien... 🌼",
                "Va a valer la pena, lo prometo 💛",
                "Última oportunidad para decir que sí 😌"
            ];
            let noCount = 0;

            btnNo.addEventListener('click', () => {
                noMsgText.textContent = noTaps[Math.min(noCount, noTaps.length - 1)];
                noCount++;
                
                // Scale down the button based on clicks
                const newScale = 1 - Math.min(noCount, 4) * 0.15;
                btnNo.style.transform = `scale(${newScale})`;
                
                // Disable button after array ends
                if(noCount >= noTaps.length){
                    btnNo.style.opacity = '0.4';
                    btnNo.disabled = true;
                    btnNo.style.pointerEvents = 'none';
                }
            });

            btnYes.addEventListener('click', () => {
                screen1.classList.remove('active');
                setTimeout(() => {
                    screen2.classList.add('active');
                }, 500);
            });

            // 3. Screen 2 Logic (Cards & Poems)
            const cardsContainer = document.getElementById('cards-container');
            const modalPoem = document.getElementById('modal-poem');
            const modalText = document.getElementById('modal-text');
            const btnClosePoem = document.getElementById('btn-close-poem');
            const finalAction = document.getElementById('final-action');
            
            const poems = [
                "Como el girasol que sigue al sol,\nmi corazón te sigue a ti veloz.\nAmarillo brillante, alegre color,\nasí es la luz que tú me das, mi amor.",
                "Entre pétalos dorados escribo tu nombre,\nno hay jardín que de ti no se asombre.\nEres mi sorpresa, mi risa, mi calma,\nla flor más bonita que crece en mi alma.",
                "Si las flores amarillas hablaran de ti,\ndirían que eres dulce, sincera y feliz.\nQue iluminas cualquier día nublado,\ncomo el sol entre pétalos dorado.",
                "Guardé estas flores solo para ti,\namarillas, brillantes, como tu sonreír.\nHoy te regalo este pequeño jardín,\npara decirte: feliz cumpleaños, mi todo y mi fin."
            ];

            const openedCards = new Set();

            // Butterfly inside card SVG
            const butterflySVG = `
                <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <path d="M50 50 C20 10 10 40 40 50 Z" fill="#A7C7F4" opacity="0.9"/>
                    <path d="M50 50 C80 10 90 40 60 50 Z" fill="#F4A7B9" opacity="0.9"/>
                    <path d="M50 50 C20 90 10 60 40 50 Z" fill="#F4A7B9" opacity="0.9"/>
                    <path d="M50 50 C80 90 90 60 60 50 Z" fill="#A7C7F4" opacity="0.9"/>
                    <ellipse cx="50" cy="50" rx="3" ry="18" fill="#7A5B62" />
                </svg>
            `;

            poems.forEach((poem, index) => {
                const card = document.createElement('div');
                card.className = 'surprise-card';
                card.innerHTML = butterflySVG;
                
                card.addEventListener('click', () => {
                    if (!card.classList.contains('opened')) {
                        modalText.innerText = poem;
                        modalPoem.classList.add('show');
                        card.classList.add('opened');
                        openedCards.add(index);
                    }
                });
                
                cardsContainer.appendChild(card);
            });

            btnClosePoem.addEventListener('click', () => {
                modalPoem.classList.remove('show');
                
                // Show final button and exact text if all 4 are open
                if (openedCards.size === poems.length) {
                    setTimeout(() => {
                        finalAction.classList.add('show');
                    }, 500);
                }
            });

            // 4. Final Form Logic (AJAX Email Sending)
            const btnFinal = document.getElementById('btn-final');
            const modalForm = document.getElementById('modal-form');
            const flowerForm = document.getElementById('flower-form');
            const btnSubmit = document.getElementById('btn-submit');
            const formContainer = document.getElementById('form-container');
            const successContainer = document.getElementById('success-container');
            const btnCloseSuccess = document.getElementById('btn-close-success');

            btnFinal.addEventListener('click', () => {
                modalForm.classList.add('show');
            });

            flowerForm.addEventListener('submit', function(e) {
                e.preventDefault(); // Prevent page reload
                
                const originalText = btnSubmit.innerHTML;
                btnSubmit.innerHTML = 'Enviando mágicamente... ✨';
                btnSubmit.disabled = true;

                const formData = new FormData(this);

                // Target email via FormSubmit AJAX API
                fetch('https://formsubmit.co/ajax/daniromema@gmail.com', {
                    method: 'POST',
                    body: formData
                })
                .then(response => response.json())
                .then(data => {
                    if(data.success) {
                        // Hide form, show success
                        formContainer.style.display = 'none';
                        successContainer.style.display = 'block';
                    } else {
                        throw new Error('Error en el envío');
                    }
                })
                .catch(error => {
                    alert('Oops! Hubo un error mágico. Intenta de nuevo.');
                    btnSubmit.innerHTML = originalText;
                    btnSubmit.disabled = false;
                });
            });

            btnCloseSuccess.addEventListener('click', () => {
                modalForm.classList.remove('show');
            });

        });
    </script>
</body>
</html>
